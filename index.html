<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RetroC Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #display {
      width: 100vw;
      height: 100dvh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #msg {
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }

    /* --- MARCA DE AGUA (LOGO MODIFICADO) --- */
    #watermark {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999999;
      opacity: 0.50; /* Opacidad subida al 50% */
      max-width: 140px; /* Tamaño más grande (antes era 90px) */
      max-height: 80px;
      object-fit: contain;
      pointer-events: none; /* No bloquea los toques de los dedos */
      user-select: none;
    }

    /* --- BOTÓN PANTALLA COMPLETA --- */
    #fs-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999999;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <!-- Marca de agua -->
  <img id="watermark" src="./logo.png" alt="Logo">

  <!-- Botón Pantalla Completa -->
  <button id="fs-btn" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>

  <div id="msg">Iniciando cartucho...</div>
  <div id="display"></div>

  <script>
    const GAMES = {
      "doom": { title: "DOOM", rom: "./roms/doom.sfc", system: "snes" },
      "mk2":  { title: "Mortal Kombat II", rom: "./roms/mk2.sfc", system: "snes" },
      "dkc1": { title: "Donkey Kong Country", rom: "./roms/dkc1.sfc", system: "snes" },
      "dkc2": { title: "Donkey Kong Country 2", rom: "./roms/dkc2.sfc", system: "snes" },
      "dkc3": { title: "Donkey Kong Country 3", rom: "./roms/dkc3.sfc", system: "snes" },
      "ki":   { title: "Killer Instinct", rom: "./roms/ki.sfc", system: "snes" }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("game") || "doom";

    if (GAMES[id]) {
      const selected = GAMES[id];
      window.EJS_player = '#display';
      window.EJS_core = selected.system;
      window.EJS_gameUrl = selected.rom;
      window.EJS_gameName = selected.title;
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      // --- OBSERVADOR AGRESIVO PARA COLOREAR CONTROLES ---
      // Esto vigila constantemente la pantalla y colorea los botones apenas aparecen
      const observer = new MutationObserver(() => {
        const elements = document.querySelectorAll('div, button');
        elements.forEach(el => {
          const cls = (el.className || '').toString().toLowerCase();
          const elemId = (el.id || '').toString().toLowerCase();
          const txt = (el.innerText || '').trim();

          // Botón A (Rojo)
          if (cls.includes('button-a') || elemId.includes('button-a') || txt === 'A') {
            el.style.setProperty('background', 'rgba(219, 68, 55, 0.85)', 'important');
            el.style.setProperty('border', '2px solid #9e1c11', 'important');
            el.style.setProperty('color', '#fff', 'important');
          }
          // Botón B (Amarillo)
          else if (cls.includes('button-b') || elemId.includes('button-b') || txt === 'B') {
            el.style.setProperty('background', 'rgba(244, 180, 0, 0.85)', 'important');
            el.style.setProperty('border', '2px solid #b28300', 'important');
            el.style.setProperty('color', '#000', 'important');
          }
          // Botón X (Azul)
          else if (cls.includes('button-x') || elemId.includes('button-x') || txt === 'X') {
            el.style.setProperty('background', 'rgba(66, 133, 244, 0.85)', 'important');
            el.style.setProperty('border', '2px solid #1a56b8', 'important');
            el.style.setProperty('color', '#fff', 'important');
          }
          // Botón Y (Verde)
          else if (cls.includes('button-y') || elemId.includes('button-y') || txt === 'Y') {
            el.style.setProperty('background', 'rgba(15, 157, 88, 0.85)', 'important');
            el.style.setProperty('border', '2px solid #0b6b3c', 'important');
            el.style.setProperty('color', '#fff', 'important');
          }
        });
      });

      // Iniciamos el observador
      observer.observe(document.body, { childList: true, subtree: true });

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      s.onload = () => { 
        document.getElementById('msg').style.display = 'none'; 
      };
      document.body.appendChild(s);
    } else {
      document.getElementById("msg").innerHTML = `
        <h3 style="color:#ff6b6b; margin-bottom: 8px;">Cartucho no encontrado</h3>
        <p style="color:#aaa; font-size: 14px;">Revisa que el código en el chip NFC sea correcto.</p>
      `;
    }

    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
        document.getElementById('fs-btn').innerText = '✕ Salir';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        document.getElementById('fs-btn').innerText = '⛶ Pantalla Completa';
      }
    }
  </script>
</body>
</html>
