<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RetroC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100dvh; /* Altura dinámica que se adapta a las barras del celular */
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #display {
      width: 100vw;
      height: 100dvh;
      position: absolute;
      top: 0;
      left: 0;
    }
    #msg {
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }
    /* Botón flotante para pantalla completa */
    #fs-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 999999;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    #fs-btn:active {
      background: #ff4757;
    }
  </style>
</head>
<body>
  <!-- Botón Pantalla Completa -->
  <button id="fs-btn" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>

  <div id="msg">Iniciando cartucho...</div>
  <div id="display"></div>

  <script>
    // ==========================================
    // CATÁLOGO DE TUS CARTUCHOS
    // Para agregar más, sigue la misma estructura:
    // "identificador": { title: "Nombre Visible", rom: "archivo.sfc", system: "snes" }
    // ==========================================
    const GAMES = {
      "doom": { title: "DOOM", rom: "doom.sfc", system: "snes" },
      "mario": { title: "Super Mario World", rom: "mario.sfc", system: "snes" },
      "dkc": { title: "Donkey Kong Country", rom: "dkc.sfc", system: "snes" },
      "zelda": { title: "Zelda: A Link to the Past", rom: "zelda.sfc", system: "snes" },
      "topgear": { title: "Top Gear", rom: "topgear.sfc", system: "snes" },
      "mk3": { title: "Mortal Kombat 3", rom: "mk3.sfc", system: "snes" }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("game") || "doom";

    if (GAMES[id]) {
      const selected = GAMES[id];
      window.EJS_player = '#display';
      window.EJS_core = selected.system;
      window.EJS_gameUrl = selected.rom;
      window.EJS_gameName = selected.title;
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      s.onload = () => { 
        document.getElementById('msg').style.display = 'none'; 
      };
      document.body.appendChild(s);
    } else {
      document.getElementById("msg").innerHTML = `
        <h3 style="color:#ff6b6b; margin-bottom: 8px;">Cartucho no encontrado</h3>
        <p style="color:#aaa; font-size: 14px;">Revisa que el enlace del chip NFC coincida con la lista de juegos.</p>
      `;
    }

    // Función para activar pantalla completa en Android y iPhone
    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
          elem.webkitRequestFullscreen();
        }
        document.getElementById('fs-btn').innerText = '✕ Salir';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        document.getElementById('fs-btn').innerText = '⛶ Pantalla Completa';
      }
    }
  </script>
</body>
</html>
