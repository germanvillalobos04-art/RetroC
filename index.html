<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RetroC Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #display {
      width: 100vw;
      height: 100dvh;
      position: absolute;
      top: 0;
      left: 0;
    }
    #msg {
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }

    /* --- MARCA DE AGUA FLOTANTE --- */
    #watermark {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 999999;
      opacity: 0.3; /* 30% de opacidad */
      max-width: 90px;
      height: auto;
      pointer-events: none; /* No estorba al pulsar la pantalla */
      user-select: none;
      -webkit-user-drag: none;
    }

    /* --- BOTÓN PANTALLA COMPLETA --- */
    #fs-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 999999;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    #fs-btn:active {
      background: #ff4757;
    }

    /* --- ESTILOS CONTROL SNES (COLORES OFICIALES) --- */
    /* Botón B (Abajo): Amarillo */
    .ejs--virtual-gamepad-button-b,
    [data-button="b"],
    [data-key="b"] {
      background: rgba(255, 183, 3, 0.82) !important;
      border: 2px solid #ffa200 !important;
      color: #000 !important;
      font-weight: bold !important;
    }

    /* Botón A (Derecha): Rojo */
    .ejs--virtual-gamepad-button-a,
    [data-button="a"],
    [data-key="a"] {
      background: rgba(230, 57, 70, 0.82) !important;
      border: 2px solid #b71c1c !important;
      color: #fff !important;
      font-weight: bold !important;
    }

    /* Botón Y (Izquierda): Verde */
    .ejs--virtual-gamepad-button-y,
    [data-button="y"],
    [data-key="y"] {
      background: rgba(42, 157, 143, 0.82) !important;
      border: 2px solid #1f6f65 !important;
      color: #fff !important;
      font-weight: bold !important;
    }

    /* Botón X (Arriba): Azul */
    .ejs--virtual-gamepad-button-x,
    [data-button="x"],
    [data-key="x"] {
      background: rgba(69, 123, 157, 0.82) !important;
      border: 2px solid #1d4e6d !important;
      color: #fff !important;
      font-weight: bold !important;
    }

    /* Gatillos L y R: Gris SNES */
    .ejs--virtual-gamepad-button-l,
    .ejs--virtual-gamepad-button-r,
    [data-button="l"],
    [data-button="r"] {
      background: rgba(140, 140, 150, 0.75) !important;
      border: 1px solid #ffffff66 !important;
      color: #fff !important;
    }
  </style>
</head>
<body>
  <!-- Marca de agua (logo.png debe estar en tu repositorio) -->
  <img id="watermark" src="./logo.png" alt="Logo" onerror="this.style.display='none'">

  <button id="fs-btn" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>

  <div id="msg">Iniciando cartucho...</div>
  <div id="display"></div>

  <script>
    const GAMES = {
      "doom": { title: "DOOM", rom: "./roms/doom.sfc", system: "snes" },
      "mk2":  { title: "Mortal Kombat II", rom: "./roms/mk2.sfc", system: "snes" },
      "dkc1": { title: "Donkey Kong Country", rom: "./roms/dkc1.sfc", system: "snes" },
      "dkc2": { title: "Donkey Kong Country 2", rom: "./roms/dkc2.sfc", system: "snes" },
      "dkc3": { title: "Donkey Kong Country 3", rom: "./roms/dkc3.sfc", system: "snes" },
      "ki":   { title: "Killer Instinct", rom: "./roms/ki.sfc", system: "snes" }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("game") || "doom";

    if (GAMES[id]) {
      const selected = GAMES[id];
      window.EJS_player = '#display';
      window.EJS_core = selected.system;
      window.EJS_gameUrl = selected.rom;
      window.EJS_gameName = selected.title;
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      s.onload = () => { 
        document.getElementById('msg').style.display = 'none'; 
      };
      document.body.appendChild(s);
    } else {
      document.getElementById("msg").innerHTML = `
        <h3 style="color:#ff6b6b; margin-bottom: 8px;">Cartucho no encontrado</h3>
        <p style="color:#aaa; font-size: 14px;">Revisa que el código en el chip NFC sea correcto.</p>
      `;
    }

    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
        document.getElementById('fs-btn').innerText = '✕ Salir';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        document.getElementById('fs-btn').innerText = '⛶ Pantalla Completa';
      }
    }
  </script>
</body>
</html>
