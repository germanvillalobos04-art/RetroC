<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RetroC Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #display {
      width: 100vw;
      height: calc(100dvh - 45px); 
      position: absolute;
      top: 45px; 
      left: 0;
      z-index: 1;
    }
    
    #msg {
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }

    #watermark {
      position: fixed;
      top: 4px; 
      left: 12px;
      z-index: 9999999;
      opacity: 1.0; 
      max-width: 150px;  
      max-height: 36px;  
      object-fit: contain;
      pointer-events: none; 
      user-select: none;
    }

    #top-controls {
      position: fixed;
      top: 8px; 
      right: 12px; 
      z-index: 9999999;
      display: flex;
      gap: 6px;
    }

    #top-controls button {
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    #top-controls button:active {
      background: rgba(100, 100, 100, 0.85);
    }
  </style>
</head>
<body>
  <img id="watermark" src="./logo.png" alt="Logo">
  
  <div id="top-controls">
    <button onclick="quickSave()">💾 Guardar</button>
    <button onclick="quickLoad()">📂 Cargar</button>
    <button onclick="toggleFullScreen()" id="fs-btn">⛶ Pantalla</button>
  </div>

  <div id="msg">Iniciando cartucho...</div>
  <div id="display"></div>

  <!-- CATÁLOGO DE JUEGOS -->
  <script src="./games.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("game") || "doom";

    // --- BASE DE DATOS LOCAL PARA GUARDAR PARTIDAS ---
    let savesDB;
    const dbRequest = indexedDB.open("RetroC_SavesDB", 1);
    dbRequest.onupgradeneeded = function(e) {
      savesDB = e.target.result;
      if (!savesDB.objectStoreNames.contains("states")) {
        savesDB.createObjectStore("states");
      }
    };
    dbRequest.onsuccess = function(e) {
      savesDB = e.target.result;
    };

    async function quickSave() {
      if (window.EJS_emulator && window.EJS_emulator.gameManager) {
        try {
          const state = await window.EJS_emulator.gameManager.getState();
          if (state && savesDB) {
            const tx = savesDB.transaction("states", "readwrite");
            tx.objectStore("states").put(state, id);
            showToast("💾 Partida Guardada", 2000);
            if (navigator.vibrate) navigator.vibrate(30);
          }
        } catch (e) { console.error(e); showToast("❌ Error al guardar", 2000); }
      } else { showToast("⏳ Espera a que cargue el juego", 2000); }
    }

    async function quickLoad() {
      if (window.EJS_emulator && window.EJS_emulator.gameManager && savesDB) {
        try {
          const tx = savesDB.transaction("states", "readonly");
          const req = tx.objectStore("states").get(id);
          req.onsuccess = async function(e) {
            const state = e.target.result;
            if (state) {
              await window.EJS_emulator.gameManager.loadState(state);
              showToast("📂 Partida Cargada", 2000);
              if (navigator.vibrate) navigator.vibrate(30);
            } else { showToast("❌ No hay partida guardada", 2000); }
          };
        } catch (e) { console.error(e); showToast("❌ Error al cargar", 2000); }
      } else { showToast("⏳ Espera a que cargue el juego", 2000); }
    }

    // Función de notificaciones con tiempo ajustable
    function showToast(text, duration) {
      let t = document.createElement('div');
      t.innerText = text;
      t.style.cssText = "position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); color:#fff; padding:10px 22px; border-radius:20px; z-index:9999999; font-weight:bold; font-size:14px; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); transition: opacity 0.3s;";
      document.body.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 300);
      }, duration);
    }

    // --- CARGA DEL JUEGO ---
    if (typeof GAMES !== 'undefined' && GAMES[id]) {
      const selected = GAMES[id];
      window.EJS_player = '#display';
      window.EJS_core = selected.system;
      window.EJS_gameUrl = selected.rom;
      window.EJS_gameName = selected.title;
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      // --- RESPUESTA HÁPTICA Y DESLIZAMIENTO DE BOTONES (FAT THUMB) ---
      const fatThumbState = new Map();

      // Crea toques fantasma para engañar al emulador
      function simularToque(btn, type) {
        if(!btn) return;
        btn.dispatchEvent(new PointerEvent(type === 'press' ? 'pointerdown' : 'pointerup', { bubbles: true, cancelable: true }));
        btn.dispatchEvent(new MouseEvent(type === 'press' ? 'mousedown' : 'mouseup', { bubbles: true, cancelable: true }));
        try {
          btn.dispatchEvent(new TouchEvent(type === 'press' ? 'touchstart' : 'touchend', { bubbles: true, cancelable: true }));
        } catch(e){}
      }

      function obtenerBotonVirtual(el) {
        if (!el) return null;
        const btn = el.closest('div[class*="button-"], button[id*="button-"]');
        if (!btn) return null;
        const txt = (btn.innerText || btn.textContent || '').trim().toUpperCase();
        if (['A','B','X','Y'].includes(txt) || (btn.className||'').toLowerCase().includes('button-')) return btn;
        return null;
      }

      // 1. Al tocar por primera vez
      document.addEventListener('touchstart', function(e) {
        for (let t of e.changedTouches) {
          const target = document.elementFromPoint(t.clientX, t.clientY);
          const btn = obtenerBotonVirtual(target);
          
          if (btn) {
            fatThumbState.set(t.identifier, { origin: btn, secondaries: new Set() });
            if (navigator.vibrate) navigator.vibrate(15);
          }
        }
      }, { passive: true });

      // 2. Al deslizar el dedo (Aquí ocurre la magia)
      document.addEventListener('touchmove', function(e) {
        for (let t of e.changedTouches) {
          const state = fatThumbState.get(t.identifier);
          if (!state) continue;

          const currentHover = obtenerBotonVirtual(document.elementFromPoint(t.clientX, t.clientY));
          
          // Si nos movimos a un botón diferente al original
          if (currentHover && currentHover !== state.origin) {
            if (!state.secondaries.has(currentHover)) {
              simularToque(currentHover, 'press'); // Presiona el nuevo botón (B)
              state.secondaries.add(currentHover);
              if (navigator.vibrate) navigator.vibrate(15);
            }
          }

          // Si nos salimos del segundo botón, lo soltamos (¡Pero la Y original sigue presionada!)
          for (let sec of state.secondaries) {
            if (sec !== currentHover) {
              simularToque(sec, 'release');
              state.secondaries.delete(sec);
            }
          }
        }
      }, { passive: true });

      // 3. Al levantar el dedo (Soltamos todo)
      document.addEventListener('touchend', function(e) {
        for (let t of e.changedTouches) {
          const state = fatThumbState.get(t.identifier);
          if (state) {
            for (let sec of state.secondaries) simularToque(sec, 'release');
            fatThumbState.delete(t.identifier);
          }
        }
      }, { passive: true });
      
      document.addEventListener('touchcancel', function(e) {
        for (let t of e.changedTouches) {
          const state = fatThumbState.get(t.identifier);
          if (state) {
            for (let sec of state.secondaries) simularToque(sec, 'release');
            fatThumbState.delete(t.identifier);
          }
        }
      }, { passive: true });


      // --- ESTILIZADO DE COLORES ---
      function styleBtn(el, bg, border, textColor = '#ffffff') {
        el.style.setProperty('background', bg, 'important');
        el.style.setProperty('border', border, 'important');
        el.style.setProperty('color', textColor, 'important');
        el.style.setProperty('text-shadow', '0 1px 2px rgba(0,0,0,0.8)', 'important');
        const innerTextEls = el.querySelectorAll('*');
        innerTextEls.forEach(child => {
          child.style.setProperty('color', textColor, 'important');
          child.style.setProperty('fill', textColor, 'important');
        });
      }

      const observer = new MutationObserver(() => {
        const elements = document.querySelectorAll('div, button, span');
        elements.forEach(el => {
          const cls = (el.className || '').toString().toLowerCase();
          const elemId = (el.id || '').toString().toLowerCase();
          const txt = (el.innerText || el.textContent || '').trim().toUpperCase();

          const isDpad = cls.includes('dpad') || elemId.includes('dpad') || cls.includes('direction') || cls.includes('joystick') || cls.includes('up') || cls.includes('down') || cls.includes('left') || cls.includes('right');

          if (cls.includes('button-a') || elemId.includes('button-a') || txt === 'A') {
            styleBtn(el, 'rgba(230, 57, 70, 0.88)', '2px solid #9e1c11', '#ffffff');
          } else if (cls.includes('button-b') || elemId.includes('button-b') || txt === 'B') {
            styleBtn(el, 'rgba(255, 183, 3, 0.88)', '2px solid #b28300', '#ffffff');
          } else if (cls.includes('button-x') || elemId.includes('button-x') || txt === 'X') {
            styleBtn(el, 'rgba(29, 112, 184, 0.88)', '2px solid #144b7d', '#ffffff');
          } else if (cls.includes('button-y') || elemId.includes('button-y') || txt === 'Y') {
            styleBtn(el, 'rgba(42, 157, 143, 0.88)', '2px solid #1c6b60', '#ffffff');
          } else if (!isDpad && (cls.includes('button-l') || txt === 'L' || txt === 'L1' || cls.includes('button-r') || txt === 'R' || txt === 'R1')) {
            styleBtn(el, 'rgba(153, 153, 161, 0.85)', '2px solid #777780', '#ffffff');
          }
        });
      });

      observer.observe(document.body, { childList: true, subtree: true });

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      
      // Mensaje al terminar de cargar
      s.onload = () => { 
        document.getElementById('msg').style.display = 'none'; 
        showToast("👆 Toca '⛶ Pantalla' arriba a la derecha para iniciar", 3500);
      };
      
      document.body.appendChild(s);
    } else {
      document.getElementById("msg").innerHTML = `
        <h3 style="color:#ff6b6b; margin-bottom: 8px;">Cartucho no encontrado</h3>
        <p style="color:#aaa; font-size: 14px;">Revisa que el código en el chip NFC sea correcto, o verifica que games.js se haya cargado.</p>
      `;
    }

    function toggleFullScreen() {
      const elem = document.documentElement;
      const btn = document.getElementById('fs-btn');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) { elem.requestFullscreen(); } 
        else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
        btn.innerText = '✕ Salir';
      } else {
        if (document.exitFullscreen) { document.exitFullscreen(); } 
        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
        btn.innerText = '⛶ Pantalla';
      }
    }
  </script>
</body>
</html>
