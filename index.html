<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Cartucho Retro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #display { width: 100vw; height: 100vh; }
    #msg { color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="msg">Cargando cartucho...</div>
  <div id="display"></div>

  <script>
    const GAMES = {
      "doom": { title: "DOOM", rom: "doom.sfc", system: "snes" }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("game") || "doom";

    if (GAMES[id]) {
      const selected = GAMES[id];
      window.EJS_player = '#display';
      window.EJS_core = selected.system;
      window.EJS_gameUrl = selected.rom;
      window.EJS_gameName = selected.title;
      window.EJS_startOnLoaded = true;
      window.EJS_fullscreenOnLoaded = true;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      s.onload = () => { document.getElementById('msg').style.display = 'none'; };
      document.body.appendChild(s);
    } else {
      document.getElementById("msg").innerText = "Cartucho no válido.";
    }
  </script>
</body>
</html>
