<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RetroC Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #display {
      width: 100vw;
      height: calc(100dvh - 45px); 
      position: absolute;
      top: 45px; 
      left: 0;
      z-index: 1;
    }
    
    #msg {
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }

    #watermark {
      position: fixed;
      top: 4px; 
      left: 12px;
      z-index: 9999999;
      opacity: 1.0; 
      max-width: 150px;  
      max-height: 36px;  
      object-fit: contain;
      pointer-events: none; 
      user-select: none;
    }

    #top-controls {
      position: fixed;
      top: 8px; 
      right: 12px; 
      z-index: 9999999;
      display: flex;
      gap: 6px;
    }

    #top-controls button {
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    #top-controls button:active {
      background: rgba(100, 100, 100, 0.85);
    }
  </style>
</head>
<body>
  <img id="watermark" src="./logo.png" alt="Logo">
  
  <div id="top-controls">
    <button onclick="quickSave()">💾 Guardar</button>
    <button onclick="quickLoad()">📂 Cargar</button>
    <button onclick="toggleFullScreen()" id="fs-btn">⛶ Pantalla</button>
  </div>

  <div id="msg">Iniciando cartucho...</div>
  <div id="display"></div>

  <!-- IMPORTAMOS LA LISTA DE JUEGOS DESDE EL NUEVO ARCHIVO -->
  <script src="./games.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("game") || "doom";

    // --- BASE DE DATOS LOCAL PARA GUARDAR PARTIDAS ---
    let savesDB;
    const dbRequest = indexedDB.open("RetroC_SavesDB", 1);
    dbRequest.onupgradeneeded = function(e) {
      savesDB = e.target.result;
      if (!savesDB.objectStoreNames.contains("states")) {
        savesDB.createObjectStore("states");
      }
    };
    dbRequest.onsuccess = function(e) {
      savesDB = e.target.result;
    };

    async function quickSave() {
      if (window.EJS_emulator && window.EJS_emulator.gameManager) {
        try {
          const state = await window.EJS_emulator.gameManager.getState();
          if (state && savesDB) {
            const tx = savesDB.transaction("states", "readwrite");
            tx.objectStore("states").put(state, id);
            showToast("💾 Partida Guardada");
            if (navigator.vibrate) navigator.vibrate(30);
          }
        } catch (e) {
          console.error(e);
          showToast("❌ Error al guardar");
        }
      } else {
        showToast("⏳ Espera a que cargue el juego");
      }
    }

    async function quickLoad() {
      if (window.EJS_emulator && window.EJS_emulator.gameManager && savesDB) {
        try {
          const tx = savesDB.transaction("states", "readonly");
          const req = tx.objectStore("states").get(id);
          req.onsuccess = async function(e) {
            const state = e.target.result;
            if (state) {
              await window.EJS_emulator.gameManager.loadState(state);
              showToast("📂 Partida Cargada");
              if (navigator.vibrate) navigator.vibrate(30);
            } else {
              showToast("❌ No hay partida guardada");
            }
          };
        } catch (e) {
          console.error(e);
          showToast("❌ Error al cargar");
        }
      } else {
        showToast("⏳ Espera a que cargue el juego");
      }
    }

    function showToast(text) {
      let t = document.createElement('div');
      t.innerText = text;
      t.style.cssText = "position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); color:#fff; padding:10px 22px; border-radius:20px; z-index:9999999; font-weight:bold; font-size:14px; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2);";
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    // --- CARGA DEL JUEGO ---
    if (typeof GAMES !== 'undefined' && GAMES[id]) {
      const selected = GAMES[id];
      window.EJS_player = '#display';
      window.EJS_core = selected.system;
      window.EJS_gameUrl = selected.rom;
      window.EJS_gameName = selected.title;
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      document.addEventListener('touchstart', function(e) {
        let target = e.target;
        while (target && target !== document.body) {
          const cls = (target.className || '').toString().toLowerCase();
          const elemId = (target.id || '').toString().toLowerCase();
          
          if (cls.includes('button') || cls.includes('dpad') || cls.includes('direction') || 
              cls.includes('up') || cls.includes('down') || cls.includes('left') || cls.includes('right') ||
              elemId.includes('button') || elemId.includes('dpad')) {
            if (navigator.vibrate) navigator.vibrate(15);
            break;
          }
          target = target.parentNode;
        }
      }, { passive: true });

      function styleBtn(el, bg, border, textColor = '#ffffff') {
        el.style.setProperty('background', bg, 'important');
        el.style.setProperty('border', border, 'important');
        el.style.setProperty('color', textColor, 'important');
        el.style.setProperty('text-shadow', '0 1px 2px rgba(0,0,0,0.8)', 'important');
        const innerTextEls = el.querySelectorAll('*');
        innerTextEls.forEach(child => {
          child.style.setProperty('color', textColor, 'important');
          child.style.setProperty('fill', textColor, 'important');
        });
      }

      const observer = new MutationObserver(() => {
        const elements = document.querySelectorAll('div, button, span');
        elements.forEach(el => {
          const cls = (el.className || '').toString().toLowerCase();
          const elemId = (el.id || '').toString().toLowerCase();
          const txt = (el.innerText || el.textContent || '').trim().toUpperCase();

          // Identificamos rigurosamente si el elemento es parte de la cruceta
          const isDpad = cls.includes('dpad') || elemId.includes('dpad') || 
                         cls.includes('direction') || cls.includes('joystick') || 
                         cls.includes('up') || cls.includes('down') || 
                         cls.includes('left') || cls.includes('right');

          if (cls.includes('button-a') || elemId.includes('button-a') || txt === 'A') {
            styleBtn(el, 'rgba(230, 57, 70, 0.88)', '2px solid #9e1c11', '#ffffff');
          } else if (cls.includes('button-b') || elemId.includes('button-b') || txt === 'B') {
            styleBtn(el, 'rgba(255, 183, 3, 0.88)', '2px solid #b28300', '#ffffff');
          } else if (cls.includes('button-x') || elemId.includes('button-x') || txt === 'X') {
            styleBtn(el, 'rgba(29, 112, 184, 0.88)', '2px solid #144b7d', '#ffffff');
          } else if (cls.includes('button-y') || elemId.includes('button-y') || txt === 'Y') {
            styleBtn(el, 'rgba(42, 157, 143, 0.88)', '2px solid #1c6b60', '#ffffff');
          } 
          // Solo pintamos de gris si NO es de la cruceta y es L o R
          else if (!isDpad && (cls.includes('button-l') || txt === 'L' || txt === 'L1' || 
                               cls.includes('button-r') || txt === 'R' || txt === 'R1')) {
            styleBtn(el, 'rgba(153, 153, 161, 0.85)', '2px solid #777780', '#ffffff');
          }
        });
      });

      observer.observe(document.body, { childList: true, subtree: true });

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      s.onload = () => { 
        document.getElementById('msg').style.display = 'none'; 
      };
      document.body.appendChild(s);
    } else {
      document.getElementById("msg").innerHTML = `
        <h3 style="color:#ff6b6b; margin-bottom: 8px;">Cartucho no encontrado</h3>
        <p style="color:#aaa; font-size: 14px;">Revisa que el código en el chip NFC sea correcto, o verifica que la lista games.js se haya cargado.</p>
      `;
    }

    function toggleFullScreen() {
      const elem = document.documentElement;
      const btn = document.getElementById('fs-btn');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
        btn.innerText = '✕ Salir';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        btn.innerText = '⛶ Pantalla';
      }
    }
  </script>
</body>
</html>
