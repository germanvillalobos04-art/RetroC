<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RetroC Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* --- CONTENEDOR DEL EMULADOR --- */
    #display {
      width: 100vw;
      height: calc(100dvh - 45px); 
      position: absolute;
      top: 45px; 
      left: 0;
      z-index: 1;
    }
    
    #msg {
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }

    /* --- MARCA DE AGUA (LOGO GRANDE) --- */
    #watermark {
      position: fixed;
      top: 4px; 
      left: 12px;
      z-index: 9999999;
      opacity: 1.0; 
      max-width: 180px;  
      max-height: 36px;  
      object-fit: contain;
      pointer-events: none; 
      user-select: none;
    }

    /* --- BOTÓN PANTALLA COMPLETA --- */
    #fs-btn {
      position: fixed;
      top: 8px; 
      right: 12px; 
      z-index: 9999999;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <img id="watermark" src="./logo.png" alt="Logo">
  <button id="fs-btn" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>

  <div id="msg">Iniciando cartucho...</div>
  <div id="display"></div>

  <script>
    const GAMES = {
      "doom": { title: "DOOM", rom: "./roms/doom.sfc", system: "snes" },
      "mk2":  { title: "Mortal Kombat II", rom: "./roms/mk2.sfc", system: "snes" },
      "dkc1": { title: "Donkey Kong Country", rom: "./roms/dkc1.sfc", system: "snes" },
      "dkc2": { title: "Donkey Kong Country 2", rom: "./roms/dkc2.sfc", system: "snes" },
      "dkc3": { title: "Donkey Kong Country 3", rom: "./roms/dkc3.sfc", system: "snes" },
      "ki":   { title: "Killer Instinct", rom: "./roms/ki.sfc", system: "snes" }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("game") || "doom";

    if (GAMES[id]) {
      const selected = GAMES[id];
      window.EJS_player = '#display';
      window.EJS_core = selected.system;
      window.EJS_gameUrl = selected.rom;
      window.EJS_gameName = selected.title;
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      // --- RESPUESTA HÁPTICA (VIBRACIÓN TÁCTIL) ---
      document.addEventListener('touchstart', function(e) {
        let target = e.target;
        // Recorremos los elementos tocados para ver si es un botón o parte de la cruceta
        while (target && target !== document.body) {
          const cls = (target.className || '').toString().toLowerCase();
          const elemId = (target.id || '').toString().toLowerCase();
          
          if (cls.includes('button') || cls.includes('dpad') || cls.includes('direction') || 
              cls.includes('up') || cls.includes('down') || cls.includes('left') || cls.includes('right') ||
              elemId.includes('button') || elemId.includes('dpad')) {
            
            // Dispara un pulso de vibración corto y seco de 15 milisegundos
            if (navigator.vibrate) {
              navigator.vibrate(15);
            }
            break;
          }
          target = target.parentNode;
        }
      }, { passive: true });

      // --- ESTILIZADO DE BOTONES ---
      function styleBtn(el, bg, border, textColor = '#ffffff') {
        el.style.setProperty('background', bg, 'important');
        el.style.setProperty('border', border, 'important');
        el.style.setProperty('color', textColor, 'important');
        el.style.setProperty('text-shadow', '0 1px 2px rgba(0,0,0,0.8)', 'important');
        const innerTextEls = el.querySelectorAll('*');
        innerTextEls.forEach(child => {
          child.style.setProperty('color', textColor, 'important');
          child.style.setProperty('fill', textColor, 'important');
        });
      }

      const observer = new MutationObserver(() => {
        const elements = document.querySelectorAll('div, button, span');
        elements.forEach(el => {
          const cls = (el.className || '').toString().toLowerCase();
          const elemId = (el.id || '').toString().toLowerCase();
          const txt = (el.innerText || el.textContent || '').trim().toUpperCase();

          // Botones A, B, X, Y
          if (cls.includes('button-a') || elemId.includes('button-a') || txt === 'A') {
            styleBtn(el, 'rgba(230, 57, 70, 0.88)', '2px solid #9e1c11', '#ffffff');
          } else if (cls.includes('button-b') || elemId.includes('button-b') || txt === 'B') {
            styleBtn(el, 'rgba(255, 183, 3, 0.88)', '2px solid #b28300', '#ffffff');
          } else if (cls.includes('button-x') || elemId.includes('button-x') || txt === 'X') {
            styleBtn(el, 'rgba(29, 112, 184, 0.88)', '2px solid #144b7d', '#ffffff');
          } else if (cls.includes('button-y') || elemId.includes('button-y') || txt === 'Y') {
            styleBtn(el, 'rgba(42, 157, 143, 0.88)', '2px solid #1c6b60', '#ffffff');
          } 
          // Gatillos L y R
          else if (cls.includes('button-l') || elemId.includes('button-l') || txt === 'L' || txt === 'L1' ||
                   cls.includes('button-r') || elemId.includes('button-r') || txt === 'R' || txt === 'R1') {
            styleBtn(el, 'rgba(153, 153, 161, 0.85)', '2px solid #777780', '#ffffff');
          } 
          // Procesamiento de la Cruceta / D-Pad
          else {
            const hasDir = ['up', 'down', 'left', 'right'].some(dir => cls.includes(dir) || elemId.includes(dir));
            const isDpadContainer = (cls.includes('dpad') || elemId.includes('dpad') || cls.includes('joystick')) && !hasDir;

            if (isDpadContainer) {
              const svgCross = "url(\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='32' y='0' width='36' height='100' rx='8' fill='%23585858' /%3E%3Crect x='0' y='32' width='100' height='36' rx='8' fill='%23585858' /%3E%3Cpolygon points='50,8 38,22 62,22' fill='%23222222' /%3E%3Cpolygon points='50,92 38,78 62,78' fill='%23222222' /%3E%3Cpolygon points='8,50 22,38 22,62' fill='%23222222' /%3E%3Cpolygon points='92,50 78,38 78,62' fill='%23222222' /%3E%3C/svg%3E\")";
              el.style.setProperty('background-image', svgCross, 'important');
              el.style.setProperty('background-size', '100% 100%', 'important');
              el.style.setProperty('background-repeat', 'no-repeat', 'important');
              el.style.setProperty('background-position', 'center', 'important');
              el.style.setProperty('background-color', 'transparent', 'important');
              el.style.setProperty('border', 'none', 'important');
              el.style.setProperty('box-shadow', 'none', 'important');
              
              const innerGraphics = el.querySelectorAll('svg, path, polygon, span');
              innerGraphics.forEach(child => {
                child.style.setProperty('opacity', '0', 'important');
              });
            } 
            else if (hasDir) {
              el.style.setProperty('background', 'transparent', 'important');
              el.style.setProperty('border', 'none', 'important');
              el.style.setProperty('box-shadow', 'none', 'important');
            }
          }
        });
      });

      observer.observe(document.body, { childList: true, subtree: true });

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      s.onload = () => { 
        document.getElementById('msg').style.display = 'none'; 
      };
      document.body.appendChild(s);
    } else {
      document.getElementById("msg").innerHTML = `
        <h3 style="color:#ff6b6b; margin-bottom: 8px;">Cartucho no encontrado</h3>
        <p style="color:#aaa; font-size: 14px;">Revisa que el código en el chip NFC sea correcto.</p>
      `;
    }

    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
        document.getElementById('fs-btn').innerText = '✕ Salir';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        document.getElementById('fs-btn').innerText = '⛶ Pantalla Completa';
      }
    }
  </script>
</body>
</html>
